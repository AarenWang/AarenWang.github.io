<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="830" viewBox="0 0 1080 830"
     font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,sans-serif">
  <title>Agent Loop 执行循环</title>
  <desc>一个圆环表示智能体执行循环：组装上下文、调用大模型、执行工具、记录结果，入口是用户任务，出口是最终回复。</desc>

  <defs>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#5F5E5A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#3B6D11" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1080" height="830" fill="#FFFFFF"/>

  <circle cx="490" cy="455" r="245" fill="none" stroke="#D3D1C7" stroke-width="10"/>

  <g fill="#888780">
    <polygon points="671.0,289.6 653.3,283.3 664.7,271.9"/>
    <polygon points="655.4,636.0 661.7,618.3 673.1,629.7"/>
    <polygon points="309.0,620.4 326.7,626.7 315.3,638.1"/>
    <polygon points="324.6,274.0 318.3,291.7 306.9,280.3"/>
  </g>

  <text x="490" y="96" text-anchor="middle" font-size="30" font-weight="600" fill="#2C2C2A">用户任务</text>
  <path d="M490 112 L490 158" fill="none" stroke="#5F5E5A" stroke-width="4" marker-end="url(#aGray)"/>

  <path d="M850 455 L916 455" fill="none" stroke="#3B6D11" stroke-width="6" marker-end="url(#aGreen)"/>
  <text x="932" y="447" font-size="28" font-weight="600" fill="#173404">最终回复</text>
  <text x="932" y="478" font-size="17" fill="#3B6D11">不再请求工具</text>

  <g>
    <rect x="375" y="164" width="230" height="92" rx="14" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="2"/>
    <circle cx="409" cy="202" r="16" fill="#5F5E5A"/>
    <text x="409" y="202" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600" fill="#FFFFFF">1</text>
    <text x="437" y="202" dominant-baseline="central" font-size="28" font-weight="600" fill="#2C2C2A">组装上下文</text>
    <text x="437" y="238" dominant-baseline="central" font-size="19" fill="#5F5E5A">提示词 + 历史</text>
  </g>

  <g>
    <rect x="620" y="409" width="230" height="92" rx="14" fill="#FFFFFF" stroke="#534AB7" stroke-width="2"/>
    <circle cx="654" cy="447" r="16" fill="#534AB7"/>
    <text x="654" y="447" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600" fill="#FFFFFF">2</text>
    <text x="682" y="447" dominant-baseline="central" font-size="28" font-weight="600" fill="#26215C">调用大模型</text>
    <text x="682" y="483" dominant-baseline="central" font-size="19" fill="#534AB7">判断下一步</text>
  </g>

  <g>
    <rect x="375" y="654" width="230" height="92" rx="14" fill="#FFFFFF" stroke="#BA7517" stroke-width="2"/>
    <circle cx="409" cy="692" r="16" fill="#BA7517"/>
    <text x="409" y="692" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600" fill="#FFFFFF">3</text>
    <text x="437" y="692" dominant-baseline="central" font-size="28" font-weight="600" fill="#4A1B0C">执行工具</text>
    <text x="437" y="728" dominant-baseline="central" font-size="19" fill="#BA7517">读写文件 / 跑命令</text>
  </g>

  <g>
    <rect x="130" y="409" width="230" height="92" rx="14" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2"/>
    <circle cx="164" cy="447" r="16" fill="#0F6E56"/>
    <text x="164" y="447" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600" fill="#FFFFFF">4</text>
    <text x="192" y="447" dominant-baseline="central" font-size="28" font-weight="600" fill="#04342C">记录结果</text>
    <text x="192" y="483" dominant-baseline="central" font-size="19" fill="#0F6E56">报错也要回填</text>
  </g>

  <g text-anchor="middle">
    <text x="490" y="400" font-size="34" font-weight="600" fill="#2C2C2A" letter-spacing="1">Agent Loop</text>
    <text x="490" y="447" font-size="22" fill="#5F5E5A">判断 → 行动</text>
    <text x="490" y="485" font-size="22" fill="#5F5E5A">观察 → 再判断</text>
    <text x="490" y="530" font-size="17" fill="#888780">达到最大步数也会停下</text>
  </g>

  <path d="M490 748 L490 766" fill="none" stroke="#B4B2A9" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="490" y="790" text-anchor="middle" font-size="17" fill="#888780">执行前需通过权限校验，不允许则暂停等待审批</text>
</svg>
